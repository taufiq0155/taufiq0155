name: Generate snake

on:
  # every day at midnight (UTC)
  schedule:
    - cron: "0 0 * * *"
  # a "Run workflow" button in the Actions tab
  workflow_dispatch:
  # every time the profile is changed
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Draw the snake from my contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1E3A8A&color_dots=#EBEDF0,#BFDBFE,#93C5FD,#3B82F6,#1E3A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#161B22,#1E3A8A,#1D4ED8,#3B82F6,#93C5FD

      - name: Publish the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
